# Local gates: `git commit` runs the pre-commit and commit-msg hooks, `git push`
# runs the pre-push hooks. Installed by `mise run setup`, which calls
# `pre-commit install --install-hooks` for the hook types named in
# `default_install_hook_types` below.
#
# Hooks use the tools already provided by mise (gitleaks, pre-commit) or by the
# project (.venv, ruff); only the hook repositories come from the network, and
# `--install-hooks` fetches those once. The authoritative gate is CI
# (.github/workflows/ci.yml) - a local hook can be bypassed with
# `git commit --no-verify`, CI cannot.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secrets: local binary, so the scan also works offline.
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks protect --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false

      - id: gitleaks-history
        name: gitleaks (full history, pre-push only)
        entry: gitleaks detect --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Local branch protection (#142). GitHub will not protect a branch on a
      # private repository without a paid plan, so every push runs the same gate
      # as CI before it leaves the working copy. `always_run` because the gate
      # checks the tree, not the files of this push, and because an empty push
      # must not slip past it. The escape hatch, MISE_SKIP_GATE=1, is handled in
      # the script and documented in CONTRIBUTING.md, "The pre-push gate".
      - id: pre-push-gate
        name: mise run check (full local gate; MISE_SKIP_GATE=1 to skip)
        entry: scripts/hooks/pre_push_gate.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        # pre-commit swallows a successful hook's output, which would hide both
        # the gate's progress and the MISE_SKIP_GATE=1 warning. verbose keeps
        # them on the terminal: the escape hatch has to be impossible to miss.
        verbose: true

      - id: no-dev-artifacts
        name: block local HA artifacts
        entry: |
          bash -c 'for f in "$@"; do case "$f" in
            .dev/*|*.token|config/.storage/*|secrets/*|config/home-assistant_v2.db*)
              echo "refusing to commit local artifact: $f" >&2; exit 1;; esac; done' --
        language: system
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Agent co-author trailer (#143). commit-msg stage only: the hook rewrites
      # the message file it is handed, so it must never run in the pre-commit
      # stage, where the filenames are staged files instead. Silent unless both
      # PI_PROVIDER and PI_MODEL are set in the environment.
      - id: co-author-trailer
        name: co-author trailer (agent commits)
        entry: python3 scripts/hooks/co_author.py
        language: system
        stages: [commit-msg]
