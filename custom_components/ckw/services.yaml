# Services of the CKW integration (#123). The backfill is the user-facing way to
# repair history after a meter swap or a recorder wipe: it re-imports the daily
# aggregates as long-term statistics, which is idempotent because the cumulative
# sum is recomputed from the stored anchor (ADR-0002, #85).
backfill:
  name: Backfill statistics
  description: >-
    Import the last days of CKW daily aggregates as long-term statistics again.
    Use it after a meter swap or a recorder wipe; the imported sums overwrite
    each other instead of adding up.
  fields:
    entry_id:
      name: Config entry
      description: >-
        The CKW account to repair. Leave empty to repair every configured
        account.
      example: 01J9Z5S8XQ7QK3M4N6P8R0T2V4
      selector:
        text:
    days:
      name: Days
      description: How many days of history to import, ending yesterday.
      default: 730
      example: 730
      selector:
        number:
          min: 1
          max: 3650
          mode: box
          unit_of_measurement: days
    force:
      name: Force
      description: >-
        Recompute the cumulative sum from the first imported day instead of
        continuing the stored sum, and ignore the stored checksum.
      default: false
      selector:
        boolean:
