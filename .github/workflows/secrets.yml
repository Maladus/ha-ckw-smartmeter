name: Secrets

# Secret scanning, the third of three layers (#118):
#
#   1. the local pre-commit hook (`gitleaks protect --staged`) and the pre-push
#      hook (`gitleaks detect`, full history) - gate G-3, .pre-commit-config.yaml,
#      bypassable with --no-verify;
#   2. this job, on every push to main, every pull request and once a week - it
#      cannot be bypassed from a laptop;
#   3. GitHub secret scanning with push protection, which is enabled on this
#      public repository. Push protection rejects a pushed CKW token, an access
#      token or a private key before the commit reaches the branch at all.
#
# `gitleaks detect` reads git history, so the checkout is complete
# (`fetch-depth: 0`); a shallow clone would scan one commit and green-light a
# leak that is already in `main`. `--redact` prints the finding without the
# secret - a CI log of a public repository is public too - and `--config` uses
# the same `.gitleaks.toml` as the hooks, so the CKW token rules and the fixture
# allowlist apply here as well.
#
# The binary comes from `mise.toml` (gitleaks 8.30.1) through mise-action, not
# from a floating download: a runner and a laptop scan with the same version and
# the same rules. A finding exits non-zero and the job is red; the fix is
# rotation first, then the commit that removes it (SECURITY.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 05:00 UTC: the ruleset and the default gitleaks rules move,
    # and a history that only grew through a direct or force-pushed commit still
    # gets scanned without a pull request to hang it on.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Scan the full history, redacted
        run: gitleaks detect --redact -v --config .gitleaks.toml
