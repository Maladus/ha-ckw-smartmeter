name: CI

# Every job calls a mise task and nothing else (#117): the toolchain, the
# version of ruff, gitleaks, pytest and markdownlint, and the definition of each
# gate live in mise.toml, so a laptop and a runner cannot drift apart. The same
# gates run locally before every push through the pre-push hook (#142).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (mise run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Installs exactly the tools pinned in mise.toml, node included, which is
      # what makes the npm:markdownlint-cli2 backend self-contained.
      - uses: jdx/mise-action@v5
      - name: Bootstrap (toolchain, .venv, git hooks, config/)
        run: mise run setup
      - name: Gate G-1 - lint
        run: mise run lint
      - name: Docs - Markdown lint, Diataxis layout, relative links
        run: mise run docs
      - name: Gate G-2 - tests
        run: mise run test
      - name: Types - mypy --strict
        run: mise run types
      - name: Gate G-3 - hooks
        run: mise run hooks

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Detect integration manifest
        id: detect
        run: |
          if [ -f custom_components/ckw/manifest.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No custom_components/ckw/manifest.json yet, nothing to validate."
          fi
      - name: Run hassfest
        if: steps.detect.outputs.enabled == 'true'
        uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS can only validate public repositories; skip until #110 flips visibility
    if: ${{ !github.event.repository.private }}
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Detect hacs.json
        id: detect
        run: |
          if [ -f hacs.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No hacs.json yet, nothing to validate."
          fi
      - name: Run HACS action
        if: steps.detect.outputs.enabled == 'true'
        uses: hacs/action@main
        with:
          category: integration
