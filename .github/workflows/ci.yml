name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      # The gitleaks and ruff hooks are language: system and therefore need their
      # binaries on PATH; use the versions pinned in mise.toml.
      - name: Install hook binaries
        run: |
          python -m pip install "ruff==0.17.3"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect markdownlint config
        id: detect
        run: |
          if [ -f .markdownlint.yaml ] || [ -f .markdownlint.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No markdownlint config yet, nothing to lint."
          fi
      - name: Run markdownlint-cli2
        if: steps.detect.outputs.enabled == 'true'
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Detect Python tests
        id: detect
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Python tests yet, nothing to run."
          fi
      - name: Install test dependencies
        if: steps.detect.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then
            python -m pip install -r requirements_test.txt
          else
            python -m pip install pytest
          fi
      - name: Run pytest
        if: steps.detect.outputs.enabled == 'true'
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect integration manifest
        id: detect
        run: |
          if [ -f custom_components/ckw/manifest.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No custom_components/ckw/manifest.json yet, nothing to validate."
          fi
      - name: Run hassfest
        if: steps.detect.outputs.enabled == 'true'
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect hacs.json
        id: detect
        run: |
          if [ -f hacs.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No hacs.json yet, nothing to validate."
          fi
      - name: Run HACS action
        if: steps.detect.outputs.enabled == 'true'
        uses: hacs/action@main
        with:
          category: integration
